<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>BANK APP</title>
	<script type="module" src="app.js" defer></script>
</head>
<body>
	<div id="app">Loading...</div>

	<template id="login">
		<h1>Bank app</h1>
		<section>
			<h2>login</h2>
			<form id="loginForm">
<!--				  action="javascript:login()">-->
				<label for="username">Username</label>
				<input id="username" name="user" type="text">
				<div id="loginError" role="alert"></div>
				<button type="submit">Login</button>
			</form>
		</section>
	</template>

	<hr/>
	<h2>Register</h2>
	<form id='registerForm' method="get">
<!--		action="javascript:register()"-->
		<label for="user">Username</label>
		<input id="user" name="user" type="text" maxlength="3" required>
		<label for="currency1">Currency</label>
		<input id="currency1" name="currency" type="text">
		<label for="description1">Description</label>
		<input id="description1" name="description" type="text">
		<label for="balance1">Current balance</label>
		<input id="balance1" name="balance" type="number" value="" min="1" max="100" required>
		<button type="submit">Register</button>
	</form>

	<!--	仪表盘-->
	<template id="dashboard">
		<header>
			<h1>Bank app</h1>
			<a href="/login" onclick="onLinkClick(event)">LogOut</a>
		</header>
		<section>
			Balance:<span id="balance"></span><span id="currency"></span>
		</section>
		<h2 id="description"></h2>
		<section>
			<h2>Transactions</h2>
			<table>
				<thead>
				<tr>
					<th>Date</th>
					<th>Object</th>
					<th>Amount</th>
				</tr>
				</thead>
				<tbody id="transactions"></tbody>
			</table>
		</section>
	</template>

	<template id="transaction">
		<tr>
			<td></td>
			<td></td>
			<td></td>
		</tr>
	</template>
</body>
</html>
