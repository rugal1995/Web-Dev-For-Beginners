<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>BANK APP</title>
	<script src="app.js" defer></script>
</head>
<body>
	<div id="app">Loading...</div>

	<template id="login">
		<h1>Bank app</h1>
		<section>
			<a href="/dashboard" onclick="onLinkClick(event)">Login</a>
		</section>
	</template>

	<!--	仪表盘-->
	<template id="dashboard">
		<header>
			<h1>Bank app</h1>
			<a href="/login" onclick="onLinkClick(event)">LogOut</a>
		</header>
		<section>
			Balance:100
		</section>
		<section>
			<h2>Transactions</h2>
			<table>
				<thead>
				<tr>
					<th>Date</th>
					<th>Object</th>
					<th>Amount</th>
				</tr>
				</thead>
			</table>
		</section>
	</template>
</body>
</html>
