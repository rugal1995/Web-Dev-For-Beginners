<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>requestAnimationFrame 测试</title>
	<style>
        canvas {
            background-color: #111;
            display: block;
            margin: 20px auto;
            border: 2px solid #444;
        }
        .buttons {
            text-align: center;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
        }
	</style>
</head>
<body>
	<canvas id="canvas" width="600" height="200"></canvas>
	<div class="buttons">
		<button onclick="startAnimation()">开始动画</button>
		<button onclick="stopAnimation()">停止动画</button>
	</div>

	<script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let x = 0;
        let animationId;

        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 画一个移动的小方块
            ctx.fillStyle = 'lime';
            ctx.fillRect(x, 80, 30, 30);

            // 更新位置
            x += 2;
            if (x > canvas.width) {
                x = -30; // 循环回到起点
            }

            // 请求下一帧
            animationId = requestAnimationFrame(drawFrame);
        }

        function startAnimation() {
            if (!animationId) {
                drawFrame();
            }
        }

        function stopAnimation() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
                console.log('动画已停止');
            }
        }
	</script>
</body>
</html>
